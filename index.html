<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordförråd</title>
<meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ordförråd">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column (max 40rem), segmented nav on top, the active card centered as the focus. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --sunk: #eaeee9;
  --ink: #16231e;
  --muted: #5b6a63;
  --line: #d9e0dc;
  --accent: #1f5d4a;
  --accent-ink: #ffffff;
  --ok: #2c7a4c;
  --almost: #a86b12;
  --wrong: #b83434;
  --mark: #fbe3a3;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #172019; --sunk: #111915; --ink: #e6eee9; --muted: #96a59e; --line: #29352f;
  --accent: #74c6a5; --accent-ink: #0a1511; --ok: #6fd09a; --almost: #f0bf63; --wrong: #f07f7f; --mark: #5a4718;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #172019; --sunk: #111915; --ink: #e6eee9; --muted: #96a59e; --line: #29352f;
  --accent: #74c6a5; --accent-ink: #0a1511; --ok: #6fd09a; --almost: #f0bf63; --wrong: #f07f7f; --mark: #5a4718;
  color-scheme: dark }

[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 40rem; margin: 0 auto; padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; letter-spacing: -0.01em; }
.brand small { display: block; font: 500 .72rem/1.4 var(--f-body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
nav.tabs { display: flex; background: var(--sunk); border-radius: 999px; padding: 4px; gap: 2px; }
nav.tabs button { border: 0; background: transparent; color: var(--muted); font: 600 .9rem var(--f-body); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; margin: 0; text-wrap: balance; }
h3 { margin: 0; font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stat b { display: block; font: 400 1.7rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }

button, .btn { font: 600 .95rem var(--f-body); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn.danger { color: var(--wrong); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { padding: 13px 22px; font-size: 1rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: 600 .9rem var(--f-body); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:disabled { opacity: .4; cursor: not-allowed; }

input[type=text], input[type=search], textarea, select {
  font: 400 1rem var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
textarea { font-family: var(--f-mono); font-size: .85rem; min-height: 120px; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--muted); flex: 1 1 160px; min-width: 0; }

/* Session */
.session-top { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.count { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 32px 22px 24px; display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; box-shadow: 0 10px 30px -18px rgb(0 0 0 / .25); }
.prompt { font: 400 clamp(2rem, 8vw, 3rem)/1.1 var(--f-display); overflow-wrap: anywhere; text-wrap: balance; }
.say { border: 0; background: var(--sunk); color: var(--muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: inline-grid; place-items: center; }
.say svg { width: 18px; height: 18px; }
.answer { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.answer input { text-align: center; font-size: 1.25rem; padding: 14px; background: var(--bg); }
.answer input.ok { border-color: var(--ok); }
.answer input.almost { border-color: var(--almost); }
.answer input.wrong { border-color: var(--wrong); }
.feedback { width: 100%; border-radius: 12px; padding: 14px; background: var(--sunk); display: flex; flex-direction: column; gap: 6px; }
.verdict { font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.almost { color: var(--almost); } .verdict.wrong { color: var(--wrong); }
.solution { font: 400 1.5rem/1.2 var(--f-display); overflow-wrap: anywhere; }
.solution mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; text-decoration: underline; text-decoration-color: var(--almost); text-underline-offset: 4px; }
.typed { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.typed s { color: var(--wrong); }
.note { font-size: .9rem; color: var(--muted); font-style: italic; }
.rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.rate .btn { padding: 14px; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.rate .btn small { font-weight: 400; font-size: .78rem; color: var(--muted); }
.rate .hard { border-color: var(--almost); }
.rate .easy { border-color: var(--ok); }
kbd { font: 500 .72rem var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }
.hint { font-size: .78rem; color: var(--muted); }

/* Learn */
.learn-card { min-height: 230px; justify-content: center; cursor: default; }
.learn-card .trans { font: 400 1.5rem/1.25 var(--f-body); color: var(--accent); overflow-wrap: anywhere; }
.learn-card .trans.hidden { color: transparent; background: var(--sunk); border-radius: 8px; cursor: pointer; user-select: none; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* Words */
.words { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.words li { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.words li:last-child { border-bottom: 0; }
.words .sv { font-weight: 600; overflow-wrap: anywhere; }
.words .en { color: var(--muted); overflow-wrap: anywhere; }
.words .cat { font-size: .7rem; font-weight: 600; letter-spacing: .04em; color: var(--accent); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; white-space: nowrap; }
.words .state {font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.words .state.due { color: var(--almost); }
.words .state.tricky { color: var(--wrong); }
.words li.editing { grid-template-columns: 1fr; }
details.import summary { cursor: pointer; font-weight: 600; }
.preview { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.preview table { border-collapse: collapse; font-size: .85rem; width: 100%; }
.preview td, .preview th { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; }
.preview th { color: var(--muted); font-weight: 600; }
.steps { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); }
.banner { font-size: .85rem; padding: 10px 14px; border-radius: 10px; background: var(--sunk); color: var(--muted); }
.empty { text-align: center; padding: 28px 16px; }
.summary-score { font: 400 3rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.missed { list-style: none; margin: 0; padding: 0; }
.missed li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.missed li span:last-child { color: var(--muted); text-align: right; }
@media (max-width: 480px) {
  nav.tabs { width: 100%; } nav.tabs button { flex: 1; padding-inline: 6px; }
  .words li { grid-template-columns: minmax(0,1fr) auto; } .words .en { grid-column: 1; grid-row: 2; }
  .words li > :last-child { grid-row: 1 / span 2; grid-column: 2; }
}
.sync-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 20px; }
.sync-grid > * { min-width: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">Ordförråd<small>Swedish vocabulary</small></div>
    <nav class="tabs" aria-label="Sections">
      <button id="tab-practice" data-view="practice">Practice</button>
      <button id="tab-learn" data-view="learn">Learn</button>
      <button id="tab-words" data-view="words">Words</button>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"><div class="panel empty"><p class="muted">Loading your words…</p></div></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";
const MIN = 60e3, DAY = 864e5;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* ---------- state & storage ---------- */
/* Everything lives in this browser's localStorage; nothing is sent anywhere. */
const S = { cards: new Map(), settings: { direction: "sv-tr", newPerDay: 20 }, ready: false };
const LS = "ordforrad.v1";
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(LS) || "null"); if (d) { S.cards = new Map(Object.entries(d.cards || {})); Object.assign(S.settings, d.settings || {}); } } catch {}
}
function saveLocal() {
  try { localStorage.setItem(LS, JSON.stringify({ cards: Object.fromEntries(S.cards), settings: S.settings })); return true; }
  catch { toast("Couldn't save on this device. Storage may be full or blocked."); return false; }
}
function saveCard(id, card) { S.cards.set(id, card); saveLocal(); return Promise.resolve(); }
function deleteCard(id) { S.cards.delete(id); saveLocal(); return Promise.resolve(); }
function saveSettings() { saveLocal(); }

function init() {
  loadLocal();
  S.ready = true;
  try { localStorage.setItem(LS + ".test", "1"); localStorage.removeItem(LS + ".test"); }
  catch { banner("This browser is blocking storage (private browsing?), so words you add won't be kept."); }
  try { navigator.storage?.persist?.(); } catch {}
  refresh();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
}
/* Keep two open tabs of the app in step. */
window.addEventListener("storage", e => { if (e.key === LS) { S.cards = new Map(); loadLocal(); refresh(); } });
function banner(t) { const b = $("#banner"); b.textContent = t; b.hidden = !t; }
let toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

/* ---------- card helpers ---------- */
const now = () => Date.now();
const isNew = c => !c.reps && !c.lapses && !c.introduced;
const isDue = c => !isNew(c) && (c.due || 0) <= now();
const isTricky = c => (c.lapses || 0) >= 2 || (!isNew(c) && (c.ease || 2.5) < 2.1);
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
function newLeftToday() {
  const introducedToday = [...S.cards.values()].filter(c => (c.introduced || 0) >= today()).length;
  return Math.max(0, (S.settings.newPerDay || 20) - introducedToday);
}
function blankCard(sv, tr, note, cat) { return { sv, tr, note: note || "", cat: cat || "", created: now(), ease: 2.5, ivl: 0, due: 0, reps: 0, lapses: 0 }; }

/* Word groups (e.g. SFI, Komvux): one active group narrows practice and learn. */
const groupNames = () => [...new Set([...S.cards.values()].map(c => c.cat).filter(Boolean))].sort((a, b) => a.localeCompare(b, "sv"));
function activeGroup() { const g = S.settings.group; return g && [...S.cards.values()].some(c => c.cat === g) ? g : null; }
function scoped() { const g = activeGroup(); return [...S.cards.entries()].filter(([, c]) => !g || c.cat === g); }
function groupChips() {
  const names = groupNames(); if (!names.length) return "";
  const g = activeGroup(), count = n => [...S.cards.values()].filter(c => c.cat === n).length;
  return `<div class="row" style="gap:10px"><span class="eyebrow">Word group</span><div class="chips" id="groups">
    <button class="chip" data-g="" aria-pressed="${!g}">All · ${S.cards.size}</button>
    ${names.map(n => `<button class="chip" data-g="${esc(n)}" aria-pressed="${g === n}">${esc(n)} · ${count(n)}</button>`).join("")}</div></div>`;
}
function wireGroupChips(after) {
  const box = $("#groups"); if (!box) return;
  box.onclick = e => { const b = e.target.closest("[data-g]"); if (!b) return; S.settings.group = b.dataset.g; saveSettings(); after(); };
}

/* ---------- answer checking ---------- */
function fold(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim(); }
const ARTICLES = /^(en|ett|att|to|the|a|an|el|la|los|las|un|una|le|les|der|die|das)\s+/;
function variants(answer) {
  /* Text in brackets is optional: accept each part without it, and with it minus the brackets. */
  const out = new Set(), text = String(answer);
  const split = s => s.split(/[,;\/]|\s+\|\s+/).map(p => p.replace(/\s+/g, " ").trim()).filter(Boolean);
  for (const v of [...split(text.replace(/\([^)]*\)/g, " ")), ...split(text.replace(/[()]/g, ""))]) {
    out.add(v);
    const stripped = v.replace(new RegExp(ARTICLES.source, "i"), "");
    if (stripped && stripped !== v) out.add(stripped);
  }
  if (!out.size && text.trim()) out.add(text.trim());
  return [...out];
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const tolerance = len => len <= 3 ? 0 : len <= 6 ? 1 : 2;
function grade(input, answer) {
  const raw = input.trim().toLowerCase().replace(/\s+/g, " ");
  if (!raw) return { result: "wrong", target: variants(answer)[0] || answer };
  const vs = variants(answer);
  const inF = fold(input).replace(ARTICLES, "");
  /* Punctuation (?, !, -) never counts against you; accents do get flagged. */
  const bare = s => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
  let best = null;
  for (const v of vs) {
    if (v.toLowerCase() === raw || bare(v) === bare(raw)) return { result: "ok", target: v };
    const vF = fold(v).replace(ARTICLES, "");
    const d = lev(inF, vF), tie = lev(raw, v.toLowerCase());
    if (!best || d < best.d || (d === best.d && tie < best.tie)) best = { d, tie, v, len: vF.length };
  }
  if (best.d === 0 || best.d <= tolerance(best.len)) return { result: "almost", target: best.v };
  return { result: "wrong", target: best.v };
}
/* Mark the letters in `target` that the typed answer got wrong or missed. */
function diffMarks(input, target) {
  const a = [...input.trim().toLowerCase()], b = [...target];
  const bl = b.map(ch => ch.toLowerCase());
  const m = a.length, n = b.length;
  const D = Array.from({ length: m + 1 }, (_, i) => { const r = new Array(n + 1).fill(0); r[0] = i; return r; });
  for (let j = 0; j <= n; j++) D[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1] === bl[j - 1] ? 0 : 1));
  const markB = new Array(n).fill(false), markA = new Array(m).fill(false);
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && D[i][j] === D[i - 1][j - 1] + (a[i - 1] === bl[j - 1] ? 0 : 1)) { if (a[i - 1] !== bl[j - 1]) { markB[j - 1] = true; markA[i - 1] = true; } i--; j--; }
    else if (j > 0 && D[i][j] === D[i][j - 1] + 1) { markB[j - 1] = true; j--; }
    else { markA[i - 1] = true; i--; }
  }
  const html = (chars, marks, tag) => { let out = "", open = false; chars.forEach((c, k) => { if (marks[k] && !open) { out += `<${tag}>`; open = true; } if (!marks[k] && open) { out += `</${tag}>`; open = false; } out += esc(c); }); return out + (open ? `</${tag}>` : ""); };
  return { target: html(b, markB, "mark"), typed: html([...input.trim()], markA, "s") };
}

/* ---------- speech ---------- */
const canSpeak = "speechSynthesis" in window;
function speak(text) {
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "sv-SE"; const v = speechSynthesis.getVoices().find(v => v.lang?.toLowerCase().startsWith("sv")); if (v) u.voice = v; u.rate = 0.9; speechSynthesis.speak(u); } catch {}
}
const SAY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn = text => canSpeak ? `<button class="say" type="button" data-say="${esc(text)}" aria-label="Hear it in Swedish">${SAY_SVG}</button>` : "";
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });

/* ---------- routing ---------- */
let view = "practice", session = null;
const VIEWS = ["practice", "learn", "words"];
function go(v) {
  view = v; session = null;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false"));

  const rows = q ? all.filter(([, c]) => fold(c.sv + " " + c.tr + " " + (c.note || "") + " " + (c.cat || "")).includes(q)) : all;
  $("#wcount").textContent = S.cards.size ? `Your words · ${S.cards.size}` : "Your words";
  if (!all.length) { list.innerHTML = `<li style="display:block" class="muted">Nothing here yet. Add a word above or import your list.</li>`; return; }
  const shown = rows.slice(0, 300);
  list.innerHTML = shown.map(([id, c]) => {
    if (editing === id) return `<li class="editing" data-id="${id}"><div class="row" style="align-items:flex-end">
      <label class="field">Swedish<input type="text" id="ed-sv" lang="sv" value="${esc(c.sv)}"></label>
      <label class="field">Translation<input type="text" id="ed-tr" value="${esc(c.tr)}"></label></div>
      <div class="row" style="align-items:flex-end"><label class="field" style="flex:3 1 220px">Note<input type="text" id="ed-note" value="${esc(c.note)}"></label>
      <label class="field">Group<input type="text" id="ed-cat" list="group-list" value="${esc(c.cat)}"></label></div>
      <div class="row"><button class="btn primary" data-act="save">Save</button><button class="btn" data-act="cancel">Cancel</button><button class="btn ghost" data-act="reset">Reset progress</button></div></li>`;
    const [lbl, cls] = stateLabel(c);
    const del = confirmDel === id
      ? `<span class="row" style="gap:4px"><button class="btn danger" data-act="del-yes">Delete</button><button class="btn ghost" data-act="del-no">Keep</button></span>`
      : `<span class="row" style="gap:2px;flex-wrap:nowrap"><span class="state ${cls}">${lbl}</span><button class="btn ghost" data-act="edit" aria-label="Edit ${esc(c.sv)}">Edit</button><button class="btn ghost" data-act="del" aria-label="Delete ${esc(c.sv)}">✕</button></span>`;
    return `<li data-id="${id}"><span class="sv" lang="sv">${esc(c.sv)}</span><span class="en">${esc(c.tr)}${c.cat ? ` <span class="cat">${esc(c.cat)}</span>` : ""}</span>${del}</li>`;
  }).join("") + (rows.length > shown.length ? `<li style="display:block" class="muted small">Showing 300 of ${rows.length}. Search to find others.</li>` : "") + (q && !rows.length ? `<li style="display:block" class="muted">No words match “${esc(wordsQuery)}”.</li>` : "");
  list.onclick = e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.closest("li").dataset.id, c = S.cards.get(id), act = b.dataset.act;
    if (act === "edit") { editing = id; confirmDel = null; drawWords(); $("#ed-sv")?.focus(); }
    else if (act === "cancel") { editing = null; drawWords(); }
    else if (act === "save") { const sv = $("#ed-sv").value.trim(), tr = $("#ed-tr").value.trim(); if (!sv || !tr) return; editing = null; saveCard(id, { ...c, sv, tr, note: $("#ed-note").value.trim(), cat: $("#ed-cat").value.trim() }).catch(() => {}); drawWords(); toast("Saved"); }
    else if (act === "reset") { editing = null; saveCard(id, { ...blankCard(c.sv, c.tr, c.note, c.cat), created: c.created }).catch(() => {}); drawWords(); toast("Progress reset"); }
    else if (act === "del") { confirmDel = id; drawWords(); }
    else if (act === "del-no") { confirmDel = null; drawWords(); }
    else if (act === "del-yes") { confirmDel = null; deleteCard(id).then(() => toast(`Deleted “${c.sv}”`)).catch(() => {}); drawWords(); }
  };
}

/* CSV / TSV parsing with quoted fields */
function parseTable(text) {
  text = text.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const first = text.split("\n").find(l => l.trim()) || "";
  const delim = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"' && f === "") q = true;
    else if (ch === delim) { row.push(f); f = ""; }
    else if (ch === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
const IMP = { rows: [], header: true, sv: 0, tr: 1, note: -1, cat: -1, date: -1, replace: false };
function guessCols(head) {
  const find = (re, taken = []) => head.findIndex((h, i) => re.test(h) && !taken.includes(i));
  let sv = find(/swed|svensk|sv\b|ord|word|name|namn|palabra|sueco/i);
  let tr = find(/transl|översätt|english|engelska|meaning|eng\b|spanish|español|espanol|traduc|betydelse/i);
  if (sv < 0) sv = 0; if (tr < 0 || tr === sv) tr = sv === 0 ? 1 : 0;
  const note = find(/note|example|exempel|anteckn|ejemplo|sentence|mening/i, [sv, tr]);
  const cat = find(/categor|kategori|group|grupp|select|level|nivå|course|kurs|tags?$/i, [sv, tr, note]);
  const date = find(/date|datum|created|added/i, [sv, tr, note, cat]);
  return { sv, tr, note, cat, date };
}
function parseImport(fromFile) {
  const box = $("#imp-map"), text = $("#imp-text").value;
  IMP.rows = text.trim() ? parseTable(text) : [];
  if (!IMP.rows.length) { box.innerHTML = ""; return; }
  const head = IMP.rows[0];
  const looksHeader = fromFile || /name|word|ord|swed|svensk|transl|english|tags|created|date|select|categor/i.test(head.join(" "));
  IMP.header = looksHeader;
  Object.assign(IMP, guessCols(looksHeader ? head : []));
  if (!looksHeader) { IMP.sv = 0; IMP.tr = 1; IMP.note = head.length > 2 ? 2 : -1; IMP.cat = IMP.date = -1; }
  drawImport();
}
/* Reads Notion dates ("November 1, 2026 4:39 PM") and ISO dates ("2026-11-01 16:39"). */
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
function parseDate(s) {
  if (!s) return 0;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)).getTime();
  m = s.match(/^([A-Za-z]{3})[A-Za-z]*\.? (\d{1,2}),? (\d{4})(?:,? (\d{1,2}):(\d{2}) ?([AP]M)?)?/i);
  if (m && MONTHS.includes(m[1].toLowerCase())) {
    let h = +(m[4] || 0);
    if (m[6]) { h %= 12; if (/pm/i.test(m[6])) h += 12; }
    return new Date(+m[3], MONTHS.indexOf(m[1].toLowerCase()), +m[2], h, +(m[5] || 0)).getTime();
  }
  const t = Date.parse(s); return isNaN(t) ? 0 : t;
}
function drawImport() {
  const box = $("#imp-map"), rows = IMP.rows, width = Math.max(...rows.map(r => r.length));
  if (width < 2) { box.innerHTML = `<p class="small" style="color:var(--wrong)">Each line needs at least two columns: the Swedish word and its translation.</p>`; return; }
  const names = Array.from({ length: width }, (_, i) => IMP.header ? (rows[0][i] || `Column ${i + 1}`) : `Column ${i + 1}`);
  const body = IMP.header ? rows.slice(1) : rows;
  const opts = (sel, none) => (none ? `<option value="-1" ${sel === -1 ? "selected" : ""}>None</option>` : "") + names.map((n, i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(n)}</option>`).join("");
  const col = (r, i) => i >= 0 ? r[i] || "" : "";
  const items = body.map(r => ({ sv: col(r, IMP.sv), tr: col(r, IMP.tr), note: col(r, IMP.note), cat: col(r, IMP.cat), date: parseDate(col(r, IMP.date)) })).filter(x => x.sv && x.tr);
  const unique = items.filter((x, i) => items.findIndex(y => dupKey(y.sv, y.tr) === dupKey(x.sv, x.tr)) === i);
  const fresh = unique.filter(x => !findDup(x.sv, x.tr));
  const plan = IMP.replace ? replacePlan(unique) : null;
  const extra = [IMP.note >= 0 && ["Note", "note"], IMP.cat >= 0 && ["Group", "cat"]].filter(Boolean);
  box.innerHTML = `<div class="stack">
    <label class="row small" style="gap:6px"><input type="checkbox" id="imp-head" ${IMP.header ? "checked" : ""}> First row holds column names</label>
    <div class="row" style="align-items:flex-end">
      <label class="field">Swedish column<select id="imp-sv">${opts(IMP.sv)}</select></label>
      <label class="field">Translation column<select id="imp-tr">${opts(IMP.tr)}</select></label>
      <label class="field">Note column<select id="imp-note">${opts(IMP.note, true)}</select></label>
    </div>
    <div class="row" style="align-items:flex-end">
      <label class="field">Group column (SFI, Komvux…)<select id="imp-cat">${opts(IMP.cat, true)}</select></label>
      <label class="field">Date added column<select id="imp-date">${opts(IMP.date, true)}</select></label>
    </div>
    <div class="preview"><table><thead><tr><th>Swedish</th><th>Translation</th>${extra.map(([h]) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${items.slice(0, 5).map(x => `<tr><td>${esc(x.sv)}</td><td>${esc(x.tr)}</td>${extra.map(([, k]) => `<td>${esc(x[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    ${S.cards.size ? `<label class="row small" style="gap:6px;align-items:flex-start"><input type="checkbox" id="imp-replace" ${IMP.replace ? "checked" : ""}> <span>Replace my current list with this file. Words with the same Swedish spelling keep their practice progress.</span></label>` : ""}
    <p class="small muted">${plan
      ? `${plural(unique.length, "word")} in the file. This will add ${plan.added}, update ${plan.updated} and remove ${plan.removed} ${plan.removed === 1 ? "word" : "words"} that aren't in the file.`
      : `${plural(items.length, "word")} found${items.length - fresh.length ? `, ${items.length - fresh.length} already in your list or repeated will be skipped` : ""}.`}</p>
    <div class="row"><button class="btn primary" id="imp-go" ${(plan ? unique.length : fresh.length) ? "" : "disabled"}>${plan ? "Replace my list" : `Import ${plural(fresh.length, "word")}`}</button></div>
  </div>`;
  $("#imp-head").onchange = e => { IMP.header = e.target.checked; drawImport(); };
  ["sv", "tr", "note", "cat", "date"].forEach(k => $("#imp-" + k).onchange = e => { IMP[k] = +e.target.value; drawImport(); });
  const rep = $("#imp-replace"); if (rep) rep.onchange = e => { IMP.replace = e.target.checked; drawImport(); };
  $("#imp-go").onclick = () => plan ? finishImport(plan.cards, `List replaced: ${unique.length} words`) : runImport(fresh);
}
/* Keeps file order: the first row gets the latest time, so the Words list shows rows in the same order. */
const importTime = (x, k, total, base) => (x.date || base) + (total - k);
function runImport(items) {
  const base = now(), cards = new Map(S.cards);
  items.forEach((x, k) => cards.set(newId(), { ...blankCard(x.sv, x.tr, x.note, x.cat), created: importTime(x, k, items.length, base) }));
  finishImport(cards, `Imported ${plural(items.length, "word")}`);
}
/* Match file rows to existing cards by Swedish spelling so corrections keep their progress. */
function replacePlan(items) {
  const base = now(), bySv = new Map(), cards = new Map();
  for (const [id, c] of S.cards) { const k = fold(c.sv); if (!bySv.has(k)) bySv.set(k, id); }
  let added = 0, updated = 0;
  items.forEach((x, k) => {
    const id = bySv.get(fold(x.sv)), fields = { sv: x.sv, tr: x.tr, note: x.note, cat: x.cat, created: importTime(x, k, items.length, base) };
    if (id && !cards.has(id)) { cards.set(id, { ...S.cards.get(id), ...fields }); updated++; }
    else { cards.set(newId(), { ...blankCard(x.sv, x.tr, x.note, x.cat), created: fields.created }); added++; }
  });
  return { cards, added, updated, removed: S.cards.size - updated };
}
function finishImport(cards, message) {
  const before = S.cards; S.cards = cards;
  if (saveLocal()) toast(message); else S.cards = before;
  IMP.replace = false;
  $("#imp-text").value = ""; $("#imp-file").value = ""; $("#imp-map").innerHTML = ""; $("#imp").open = false; drawWords();
}

/* ---------- moving words between devices ---------- */
const FILE_NAME = "ordforrad-words.json";
async function exportWords() {
  const words = [...S.cards.entries()].map(([id, c]) => ({ id, sv: c.sv, tr: c.tr, note: c.note || "", cat: c.cat || "", created: c.created || 0 }));
  const data = JSON.stringify({ app: "ordforrad", kind: "words", exported: new Date().toISOString(), words }, null, 1);
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: FILE_NAME, types: [{ description: "Word list", accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(data); await w.close();
      toast(`Exported ${plural(words.length, "word")}`); return;
    } catch (e) { if (e?.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  a.download = FILE_NAME; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast(`Exported ${plural(words.length, "word")}`);
}
/* Make this device's list match the file: add new words, apply edits, drop words no longer in it, keep progress. */
function mergeWords(list) {
  const cards = new Map(S.cards), incoming = new Set(list.map(w => w.id));
  const byKey = new Map([...cards].map(([id, c]) => [dupKey(c.sv, c.tr), id]));
  let added = 0, changed = 0, removed = 0;
  for (const w of list) {
    let id = cards.has(w.id) ? w.id : null;
    const twin = byKey.get(dupKey(w.sv, w.tr));
    if (!id && twin && !incoming.has(twin)) { cards.set(w.id, cards.get(twin)); cards.delete(twin); id = w.id; }
    if (id) {
      const c = cards.get(id);
      if (c.sv !== w.sv || c.tr !== w.tr || (c.note || "") !== w.note || (c.cat || "") !== w.cat || c.created !== w.created) { cards.set(id, { ...c, sv: w.sv, tr: w.tr, note: w.note, cat: w.cat, created: w.created || c.created }); changed++; }
    } else { cards.set(w.id, { ...blankCard(w.sv, w.tr, w.note, w.cat), created: w.created || now() }); added++; }
  }
  for (const id of [...cards.keys()]) if (!incoming.has(id)) { cards.delete(id); removed++; }
  return { cards, added, changed, removed };
}
async function readSyncFile(file) {
  const box = $("#sync-preview");
  let list, when;
  try {
    const d = JSON.parse(await file.text());
    if (d?.app !== "ordforrad" || !Array.isArray(d.words)) throw 0;
    list = d.words.filter(w => w && typeof w.id === "string" && w.sv && w.tr).map(w => ({ id: w.id, sv: String(w.sv), tr: String(w.tr), note: String(w.note || ""), cat: String(w.cat || ""), created: +w.created || 0 }));
    when = d.exported ? new Date(d.exported).toLocaleString() : "";
  } catch {
    box.innerHTML = `<p class="small" style="color:var(--wrong)">That isn't an Ordförråd word list. Choose the ${FILE_NAME} file you exported on your laptop.</p>`; return;
  }
  const m = mergeWords(list);
  const parts = [m.added && `${m.added} new`, m.changed && `${m.changed} edited`, m.removed && `${m.removed} removed`].filter(Boolean);
  box.innerHTML = `<div class="stack">
    <p class="small">${plural(list.length, "word")} in the file${when ? `, exported ${esc(when)}` : ""}.</p>
    <p class="small muted">${parts.length ? "This will make " + parts.join(", ") + " on this device. Your practice progress stays." : "This device already has these words."}${m.removed ? " Words that aren't in the file are removed from this device." : ""}</p>
    <div class="row"><button class="btn primary" id="sync-go" ${parts.length ? "" : "disabled"}>Update words</button><button class="btn ghost" id="sync-cancel">Cancel</button></div></div>`;
  const reset = () => { box.innerHTML = ""; $("#sync-file").value = ""; };
  $("#sync-cancel").onclick = reset;
  $("#sync-go").onclick = () => { S.cards = m.cards; if (saveLocal()) toast("Words updated"); reset(); drawWords(); };
}

/* ---------- boot ---------- */
const start = (location.hash || "").slice(1);
view = VIEWS.includes(start) ? start : "practice";
document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));
init();
})();
</script>
